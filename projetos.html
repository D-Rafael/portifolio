<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projetos | Portifólio Pessoal</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>
    <section id="projetos">
      <h2>Projetos</h2>
      <div class="project-card">
        <div class="project-cover">CAPA</div>
        <span class="project-category">PORTIFÓLIO PESSOAL</span>
        <h3>Portifólio Pessoal</h3>
        <p>
          Site pessoal construído em HTML, CSS e JavaScript puro, do zero, para
          apresentar minha trajetória e futuros projetos como desenvolvedor.
        </p>
        <div class="project-tags">
          <span>HTML</span>
          <span>CSS</span>
          <span>JavaScript</span>
        </div>
        <a href="#" class="btn-demo">
          <svg
            class="icon"
            width="16"
            height="16"
            fill="currentColor"
            aria-hidden="true"
          >
            <use href="#icon-eye"></use>
          </svg>
          Ver demo
        </a>
        <a
          href="https://github.com/D-Rafael/portifolio"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-github"
        >
          <svg
            class="icon"
            width="16"
            height="16"
            fill="currentColor"
            aria-hidden="true"
          >
            <use href="#icon-github"></use>
          </svg>
          GitHub
        </a>
      </div>
      <div class="project-card project-card-empty">
        <div class="project-cover">CAPA</div>
        <p>Ainda sem projeto</p>
      </div>
      <div class="project-card project-card-empty">
        <div class="project-cover">CAPA</div>
        <p>Ainda sem projeto</p>
      </div>
    </section>
    <div id="footer-placeholder"></div>
    <script src="js/script.js" defer></script>
  </body>
</html>
