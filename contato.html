<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato | Portifólio Pessoal</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>
    <section id="contato">
      <h2>Contato</h2>
      <form>
        <label for="nome">Nome</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Seu nome"
          required
        />
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          required
        />
        <label for="mensagem">Mensagem</label>
        <textarea
          name="mensagem"
          id="mensagem"
          placeholder="Como posso ajudar?"
          required
        ></textarea>

        <button type="submit">Enviar</button>
      </form>
      <div class="contact-info">
        <div>
          <strong>Email direto</strong>
          <p>
            <a href="mailto:drs10.contap@gmail.com">
              <svg
                class="icon"
                width="16"
                height="16"
                fill="currentColor"
                aria-hidden="true"
              >
                <use href="#icon-email"></use>
              </svg>
              drs10.contap@gmail.com
            </a>
          </p>
        </div>
        <div>
          <strong>Telefone</strong>
          <p>
            <a href="tel:+5555996753660">
              <svg
                class="icon"
                width="16"
                height="16"
                fill="currentColor"
                aria-hidden="true"
              >
                <use href="#icon-phone"></use>
              </svg>
              (55) 99675-3660
            </a>
          </p>
        </div>
        <div>
          <strong>WhatsApp</strong>
          <p>
            <a
              href="https://wa.me/5555996753660"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg
                class="icon"
                width="16"
                height="16"
                fill="currentColor"
                aria-hidden="true"
              >
                <use href="#icon-whatsapp"></use>
              </svg>
              (55) 99675-3660
            </a>
          </p>
        </div>
        <div>
          <strong>Respondo em</strong>
          <p>até 2 dias úteis</p>
        </div>
        <div>
          <strong>Redes</strong>
          <p>
            <a
              href="https://github.com/D-Rafael"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg
                class="icon"
                width="16"
                height="16"
                fill="currentColor"
                aria-hidden="true"
              >
                <use href="#icon-github"></use>
              </svg>
              GitHub
            </a>
            ·
            <a
              href="https://linkedin.com/in/diogorafaelarbterdasilva"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg
                class="icon"
                width="16"
                height="16"
                fill="currentColor"
                aria-hidden="true"
              >
                <use href="#icon-linkedin"></use>
              </svg>
              LinkedIn
            </a>
          </p>
        </div>
      </div>
    </section>
    <div id="footer-placeholder"></div>
    <script src="js/script.js" defer></script>
  </body>
</html>
